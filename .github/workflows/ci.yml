name: Model-free checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libportaudio2
      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt
      - name: Install Rust 1.93.0
        run: rustup toolchain install 1.93.0 --profile minimal && rustup default 1.93.0
      - name: Run isolated Python suites and model-free Rust tests
        run: python scripts/test.py
