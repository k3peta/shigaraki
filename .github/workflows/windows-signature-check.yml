name: Windows signature verification

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/verify_windows_signatures.ps1
      - tests/test_windows_signatures.ps1
      - .github/workflows/windows-signature-check.yml
  pull_request:
    paths:
      - scripts/verify_windows_signatures.ps1
      - tests/test_windows_signatures.ps1
      - .github/workflows/windows-signature-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify trusted, unsigned, tampered and missing files
        shell: pwsh
        run: ./tests/test_windows_signatures.ps1
